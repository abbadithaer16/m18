  <body class="locked">
    <div class="grain" aria-hidden="true"></div>

    <div class="page" id="page">
      <header class="topbar">
        <a class="lbl box back" href="../">Back / 戻る</a>
        <a class="logo" href="./" aria-label="Leon Vasari, filmography">
          <span class="logo__cjk">莱昂·瓦萨里</span>
          <span class="logo__latin">LEON VASARI</span>
        </a>
        <span class="lbl career">Career 1958年〜1989年</span>
      </header>

      <nav class="tabs" aria-label="Decades">
        <span class="tabs__ind" aria-hidden="true"></span>
        <button class="lbl tab" type="button" data-decade="all">All / すべて</button>
        <button class="lbl tab" type="button" data-decade="1950">1950s</button>
        <button class="lbl tab" type="button" data-decade="1960">1960s</button>
        <button class="lbl tab" type="button" data-decade="1970">1970s</button>
        <button class="lbl tab" type="button" data-decade="1980">1980s</button>
        <button class="lbl tab" type="button" data-decade="books">Books / 本</button>
      </nav>

      <section class="shelf" aria-label="Filmography shelf">
        <div class="stage" id="stage"></div>
      </section>

      <button class="play" type="button" aria-label="Open film">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 0.5 L11 6 L2 11.5 Z" fill="currentColor" /></svg>
      </button>

      <div class="caption" aria-hidden="true">
        <div class="cap cap--title"><span class="cap__sizer">Ag</span></div>
        <div class="cap cap--sub lbl"><span class="cap__sizer">Ag</span></div>
        <div class="cap cap--year"><span class="cap__sizer">Ag</span></div>
      </div>
      <p class="sr-only" id="announce" aria-live="polite"></p>

      <button class="arrow arrow--prev" type="button" aria-label="Previous film">
        <svg width="18" height="10" viewBox="0 0 18 10" aria-hidden="true"><path d="M5 1 L1 5 L5 9 M1 5 H17" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
      </button>
      <button class="arrow arrow--next" type="button" aria-label="Next film">
        <svg width="18" height="10" viewBox="0 0 18 10" aria-hidden="true"><path d="M13 1 L17 5 L13 9 M17 5 H1" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
      </button>

      <footer class="foot">
        <span class="lbl copy">© Leon Vasari. <span class="copy__long">All rights reserved.</span></span>
        <nav class="foot__nav" aria-label="Site">
          <a class="lbl box" href="./" aria-current="page">Shelf</a>

          <a class="lbl box" href="./biography.html">Biography</a>
          <a class="lbl box" href="./retrospective.html">Retrospective</a>
        </nav>
        <span class="lbl social"><a href="#" aria-label="Facebook (fictional, no account)">FB</a> / <a href="#" aria-label="Twitter (fictional, no account)">TW</a></span>
      </footer>
    </div>

    <div class="cursor" aria-hidden="true">
      <span class="cursor__ring"></span>
      <span class="cursor__dot"></span>
      <span class="cursor__label"><span>OPEN</span><span>開く</span></span>
    </div>
